name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mn_check_test
          POSTGRES_USER: mn_check
          POSTGRES_PASSWORD: mn_check_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mn_check -d mn_check_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mn_check:mn_check_test@localhost:5432/mn_check_test?sslmode=disable
      MMCHECK_ADMIN_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check frontend syntax
        run: |
          node --check frontend/app.js
          node --check frontend/sw.js
          test -s frontend/vendor/react.production.min.js
          test -s frontend/vendor/react-dom.production.min.js
      - name: Test parser and PostgreSQL persistence
        run: mvn --batch-mode --no-transfer-progress test
      - name: Build backend
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Smoke test API
        run: |
          APP_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          APP_JAR="target/mn-check-${APP_VERSION}.jar"
          java -jar "$APP_JAR" > /tmp/mn-check.log 2>&1 &
          SERVER_PID=$!
          trap 'cat /tmp/mn-check.log; kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4137/api/health > /tmp/health.json; then
              break
            fi
            kill -0 $SERVER_PID
            sleep 1
          done
          cat /tmp/health.json
          curl --fail --silent http://127.0.0.1:4137/api/version | grep "\"version\":\"${APP_VERSION}\""
          curl --fail --silent http://127.0.0.1:4137/sw.js | grep "mn-check-${APP_VERSION}"
      - name: Build production image
        run: docker build -t mn-check-ci .
